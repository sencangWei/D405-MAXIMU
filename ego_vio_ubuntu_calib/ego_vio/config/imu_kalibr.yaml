# IMU 参数文件 (Kalibr 格式)
# 用于 kalibr_calibrate_imu_camera
#
# 注意: 以下参数为 KT-EX9-2 军工 MEMS IMU 的估算值,
#       未做 Allan 方差实测。Kalibr 对这些参数不敏感,
#       数量级正确即可, 后续可用 Allan 方差精确标定。
#
# 单位:
#   gyroscope_noise_density:  rad/s / sqrt(Hz)
#   gyroscope_random_walk:    rad/s^2 / sqrt(Hz)
#   accelerometer_noise_density: m/s^2 / sqrt(Hz)
#   accelerometer_random_walk:   m/s^3 / sqrt(Hz)

rostopic: /imu0
update_rate: 400.0  # Hz

# 陀螺仪
# 估算: 噪声密度 ~0.01 deg/s/sqrt(Hz) = 1.75e-4 rad/s/sqrt(Hz)
gyroscope_noise_density: 1.75e-4
gyroscope_random_walk: 2.0e-5

# 加速度计
# 估算: 噪声密度 ~0.001 m/s^2/sqrt(Hz) = 0.1 mg/sqrt(Hz)
accelerometer_noise_density: 1.0e-3
accelerometer_random_walk: 3.0e-4

# IMU 模型: calibrated (默认, 假设工厂已标定轴对准和比例因子)
# Kalibr 只标 time offset td 和相机-IMU 外参
model: calibrated

# 时间戳来源: ros (使用消息中的 header.stamp)
timeframe: ros

# 是否使用 Mahoney 等 AHRS 约束姿态 (通常 false)
use_accel: true
