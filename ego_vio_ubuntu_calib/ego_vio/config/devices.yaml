# ego_vio 设备配置 —— 小电脑实时双手 VIO + 头部录制
#
# 临时一路测试版：只启用 left_hand，right_hand 和 head 先注释掉。
# 等三路设备到齐后再恢复。
#
# 需要填:
#   - IMU 串口号（Windows COMx，Linux /dev/ttyUSBx）
#   - D405 序列号（rs-enumerate-devices --compact 查看）

recording:
  out_dir: ./recordings        # 录制根目录
  jpg_quality: 90              # D405 彩色压缩质量
  save_depth: false            # 深度图默认不录
  imu_bin: true                # IMU 录二进制

units:
  - name: left_hand
    role: realtime_vio         # 跑 VIO + 可视化
    imu:
      port: COM9               # IMU + 供电 FT232 (2026-07-29 实测 COM9 才是活口, COM8 全零)
      baud: 921600
    camera:
      serial: "260322273737"   # D405 序列号(当前插的这台)
      width: 640
      height: 480
      fps: 30
      enable_depth: false      # 实时VIO用单目彩色
      cam_latency_ms: 71.0      # 相机传输延迟(ms)

