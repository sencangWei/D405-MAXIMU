format_version: 1
run_all_forbidden: true
session_root: calibration_sessions/{product_id}
common_pipeline: [preflight, guided_capture, automatic_solve, automatic_acceptance, immutable_report]
customer_steps:
  - number: 1
    stage: imu_static_bias
    command: ./calibrate_01_imu_static.sh {product_id}
    captures: imu_10min_static
    solves: gyro_bias_accel_norm_short_term_health
    report: imu_static_bias/report.yaml
  - number: 2
    stage: imu_allan
    command: ./calibrate_02_imu_noise.sh {product_id}
    captures: imu_15_to_24h_stationary
    solves: allan_noise_density_random_walk_bias_stability
    report: imu_allan/report.yaml
  - number: 3
    stage: imu_multipose
    command: ./calibrate_03_imu_intrinsic.sh {product_id}
    captures: imu_20_fit_plus_10_heldout_stationary_poses
    solves: arbitrary_pose_accelerometer_ellipsoid
    report: imu_multipose/report.yaml
  - number: 4
    stage: d405_stereo
    command: ./calibrate_04_d405_stereo.sh {product_id}
    captures: d405_dual_ir_aprilgrid_train_and_validation
    solves: dual_intrinsics_stereo_extrinsic_reprojection_epipolar_golden_ab
    report: d405_stereo/report.yaml
  - number: 5
    stage: camera_imu
    command: ./calibrate_05_camera_imu.sh {product_id}
    captures: two_independent_d405_dual_ir_plus_imu_dynamic_runs
    solves: kalibr_spatial_temporal_repeatability_residuals_golden_ab
    report: camera_imu/report.yaml
  - number: 6
    stage: world_z
    command: ./calibrate_06_world_z.sh {product_id}
    captures: at_least_3_planar_plus_2_true_elevation_slam_runs
    solves: one_rigid_world_rotation_leave_one_out_and_elevation_safety
    report: world_z/report.yaml
