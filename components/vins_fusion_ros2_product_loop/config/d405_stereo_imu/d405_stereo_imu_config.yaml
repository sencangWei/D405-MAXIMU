%YAML:1.0

# D405 双目 IR 720p + KT-EX9-2 IMU — 标准 VINS-Fusion 配置
# 外参: 2026-08-08 相机-IMU 联合标定 (用户新测)

imu: 1
num_of_cam: 2
imu_topic: "/imu0"
image0_topic: "/cam0/image_raw"
image1_topic: "/cam1/image_raw"
output_path: "/home/robot/vins_output/"
cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 1280
image_height: 720

# 外参: 用户 2026-08-08 联合标定, 静态验证可用
# 在线精修设 1
estimate_extrinsic: 0

# 相机-IMU 时间偏移: 固定 08-08 Kalibr 标定值 (双补偿修复: 之前 estimate_td:1 + 回放 shift=7.36 双重补偿 → 发散)
# 验证时必须 --imu-shift-ms 0, 避免与固定 td 重复补偿
estimate_td: 0
td: -0.0117

# body_T_cam0 = R_g @ inv(T_cam0_imu) (2026-08-08 联合标定)
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.99968852,  0.00656964, -0.02407688, -0.01528376,
          -0.02383466, -0.03474416, -0.99911198, -0.02793015,
          -0.00740034,  0.99937464, -0.03457675, -0.01236338,
           0.0, 0.0, 0.0, 1.0 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0.99966951,  0.00672528, -0.02481216,  0.00281157,
          -0.02457859, -0.03283312, -0.99915858, -0.02812380,
          -0.00753427,  0.99943822, -0.03265697, -0.01245857,
           0.0, 0.0, 0.0, 1.0 ]

multiple_thread: 1
max_cnt: 400
min_dist: 20
freq: 10
F_threshold: 1.0
show_track: 0
flow_back: 1
# 仅在 IMU、视觉和估计速度共同确认连续静止后加入零运动约束。
enable_zupt: 1
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

# KT-EX9-2 Allan 实测噪声 (2026-08-08)
acc_n: 8.28e-3
gyr_n: 1.03e-3
acc_w: 3.92e-6
gyr_w: 2.89e-7
g_norm: 9.805

load_previous_pose_graph: 0
pose_graph_save_path: "/home/robot/vins_output/pose_graph/"
save_image: 0

# PnP内点空间覆盖门。0表示关闭，保持当前生产候选行为。
# 只有开发/验证正负样本资格报告允许冻结阈值后，才可改为非零。
min_loop_spatial_support: 0.0

# DBoW只负责召回，候选仍必须通过左右IR、PnP、连续一致性和修正安全门。
# 小范围回到原位时外观近邻容易挤掉真实历史帧，扩大召回而不放宽验真。
max_loop_candidates: 24
