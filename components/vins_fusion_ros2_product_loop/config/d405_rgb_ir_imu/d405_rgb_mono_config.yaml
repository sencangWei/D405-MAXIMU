%YAML:1.0

# D405 RGB + KT-EX9-2 IMU — VINS-Fusion mono 配置 (对照实验)
# 剥离到单 RGB 通道: 检验 "RGB+单IR双通道" 是否本质等于 mono-RGB+IMU
# cam0 = RGB (出厂内参)

imu: 1
num_of_cam: 1
imu_topic: "/imu0"
image0_topic: "/cam0/image_raw"
output_path: "/home/robot/vins_output/"
cam0_calib: "rgb.yaml"
image_width: 1280
image_height: 720

estimate_extrinsic: 0
estimate_td: 1
td: 0.0

# body_T_cam0 = R_g @ inv(T_imu_rgb), 8/4 Kalibr + 出厂 T_rgb_to_leftir
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 9.998854031e-01, -1.260448386e-03, -1.509498734e-02, -0.010210816,
          -1.512299315e-02, -2.687526733e-02, -9.995244908e-01, -0.028394878,
           8.536738538e-04,  9.996375938e-01, -2.689171097e-02, -0.008862444,
           0.0, 0.0, 0.0, 1.0 ]

multiple_thread: 1
max_cnt: 400
min_dist: 20
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

acc_n: 8.28e-3
gyr_n: 1.03e-3
acc_w: 3.92e-6
gyr_w: 2.89e-7
g_norm: 9.805

load_previous_pose_graph: 0
pose_graph_save_path: "/home/robot/vins_output/pose_graph/"
save_image: 0
