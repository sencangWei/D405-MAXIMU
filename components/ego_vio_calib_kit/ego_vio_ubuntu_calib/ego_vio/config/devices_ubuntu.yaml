# ego_vio Ubuntu 配置 (i3 mini PC)
#
# 说明:
#   - IMU 串口号: Linux /dev/ttyUSBx 或 /dev/ttyACMx
#     用 ls /dev/ttyUSB* 或 dmesg | tail 查看
#   - D405 序列号: rs-enumerate-devices --compact 查看

recording:
  out_dir: ./recordings
  jpg_quality: 90
  save_depth: false
  imu_bin: true

units:
  - name: left_hand
    role: realtime_vio
    imu:
      port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B7E005674-if00
      baud: 921600
    camera:
      serial: "260322273737"  # Ubuntu 已确认
      width: 640
      height: 480
      fps: 30
      enable_depth: false
      cam_latency_ms: 0.0   # Ubuntu global_time 已给精确曝光时间, 无需补偿
    vio:
      backend: openvins_ros2
      cam_topic: /cam0/image_raw
      imu_topic: /imu0
      port: 100              # ROS2 publisher queue size
      qos_reliable: true
