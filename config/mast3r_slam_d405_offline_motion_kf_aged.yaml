inherit: "config/base.yaml"

# Preserve the successful motion thresholds, but stop a slowly translating
# frame from staying attached to one keyframe for more than 1.5 seconds.
# Stationary frames remain untouched because the aged trigger also requires
# about 18 mm of visual translation in the current internally scaled map.
use_calib: False
single_thread: True
dataset:
  subsample: 1

tracking:
  imu_rotation_prior: True
  imu_rotation_constraint_weight: 0.6
  imu_rotation_constraint_gate_deg: 0.5
  motion_keyframe_translation: 0.30
  motion_keyframe_rotation_deg: 8.0
  motion_keyframe_max_gap_frames: 45
  motion_keyframe_aged_translation: 0.08

retrieval:
  confirmation_frames: 2
  confirmation_immediate_frame_gap: 150
  confirmation_frame_id_radius: 60
  density_window: 10
  dense_min_keyframes: 10
  dense_max_mean_frame_gap: 24
