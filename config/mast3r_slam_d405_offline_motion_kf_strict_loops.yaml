inherit: "config/base.yaml"

# Motion-keyframe frontend plus conservative loop admission. Local neighbors
# remain available, while a long-range appearance match must persist across
# three consecutive queries within a narrow source-frame neighborhood.
use_calib: False
single_thread: True
dataset:
  subsample: 1

tracking:
  imu_rotation_prior: True
  imu_rotation_constraint_weight: 0.6
  imu_rotation_constraint_gate_deg: 0.5
  motion_keyframe_translation: 0.30
  motion_keyframe_rotation_deg: 8.0

retrieval:
  enabled: True
  confirmation_frames: 3
  confirmation_immediate_frame_gap: 30
  confirmation_frame_id_radius: 15
  density_window: 10
  dense_min_keyframes: 10
  dense_max_mean_frame_gap: 12
