# ego_vio Ubuntu 配置 (i3 mini PC)
#
# 说明:
#   - IMU 串口号: Linux /dev/ttyUSBx 或 /dev/ttyACMx
#     用 ls /dev/ttyUSB* 或 dmesg | tail 查看
#   - D405 序列号: rs-enumerate-devices --compact 查看

recording:
  out_dir: ./recordings
  jpg_quality: 90
  save_depth: false
  imu_bin: true

units:
  - name: left_hand
    role: realtime_vio
    imu:
      port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B7E005674-if00
      baud: 921600
      calibration: camimu_720p_leftir_kalibr.yaml
    camera:
      serial: "260322273737"  # Ubuntu 已确认
      # D405 左右红外双目 1280x720@30（与四流采集/后端SLAM统一 720p）
      width: 1280
      height: 720
      fps: 30
      enable_depth: false
      stereo_ir: true
      auto_exposure: false
      exposure_us: 20000       # 固定20 ms，避免自动曝光贴近33 ms帧周期
      gain: 48
      cam_latency_ms: 0.0   # Ubuntu global_time 已给精确曝光时间, 无需补偿
    vio:
      backend: openvins_ros2
      cam_topic: /cam0/image_raw
      cam1_topic: /cam1/image_raw
      imu_topic: /imu0
      stereo: true
      port: 100              # ROS2 publisher queue size
      qos_reliable: true
