inherit: "config/base.yaml"

# 只加两条：aged_motion 补空洞。阈值（0.15 / 5.0）一个字不改。
#
# 为什么是这个杠杆而不是收紧 rotation：
#   rotation 从 5.0 收到 1.0，第一个关键帧只从帧 226 挪到 222（0.13s）——
#   因为"视觉 vs IMU 先验的旋转分歧"在前 7.37s 一直 <1°，之后才爬到 1–2.5°。
#   阈值够不到那个空洞，而且它是【全局】的：收了它整条轨迹的关键帧都变密
#   （实测 3.4x，512 个关键帧，工具链崩了）。
#
# aged_motion 不一样：它只在【距上个关键帧已过 >= 15 帧】时才可能触发，
# 也就是【只补空洞】——而空洞就是没有运动触发的地方，正是开头。
# 阈值不动 ⇒ 运动触发的位置一个不变。
#
# aged_translation 为什么是 1e-6（实测定的，不是猜的）：
#   触发器比的是"当前帧相对上个关键帧的平移"。在 batch5/g3 上实测该量
#   在开头 6s 只有 2e-5（≈0.009mm），逐帧抖动 ~1e-5，帧 226 才跳到 0.0254。
#   既有配置用的 0.01 / 0.08 在这个 take 上【永远够不着】。取 1e-6 保证触发。
#
# ⚠ 已知风险（不隐去）：这样补出来的关键帧基线近似为 0（开头几乎只有旋转），
#   而运动门控本来就是为了避免这种零基线关键帧。所以若结果变差，
#   不能直接读成"洞不是原因"，也可能是"零基线关键帧本身有害"。
use_calib: False
single_thread: True
dataset:
  subsample: 1

tracking:
  imu_rotation_prior: True
  imu_rotation_constraint_weight: 0.6
  imu_rotation_constraint_gate_deg: 0.5
  motion_keyframe_translation: 0.15
  motion_keyframe_rotation_deg: 5.0
  motion_keyframe_max_gap_frames: 15
  motion_keyframe_aged_translation: 0.000001

retrieval:
  confirmation_frames: 2
  confirmation_immediate_frame_gap: 150
  confirmation_frame_id_radius: 60
  density_window: 10
  dense_min_keyframes: 10
  dense_max_mean_frame_gap: 24
