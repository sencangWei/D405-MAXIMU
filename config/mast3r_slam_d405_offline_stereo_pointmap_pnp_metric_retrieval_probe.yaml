inherit: "/home/robot/ego_vio_humble/config/mast3r_slam_d405_offline_stereo_pointmap_pnp_retrieval_probe.yaml"

# Protect the global pose graph from appearance-only false loops. The gate uses
# only MASt3R correspondences, synchronized D405 stereo metric anchors and the
# recorded camera intrinsics; external trajectories are not available here.
local_opt:
  metric_loop_gate: True
  metric_loop_pnp_min_points: 100
  metric_loop_pnp_min_inlier_ratio: 0.50
  metric_loop_pnp_reprojection_error_px: 2.0
  metric_loop_pnp_max_reprojection_p95_px: 4.0
  metric_loop_pnp_max_cycle_translation_m: 0.005
  metric_loop_pnp_max_cycle_rotation_deg: 2.0
  metric_loop_pnp_max_points: 5000
