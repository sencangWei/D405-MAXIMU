inherit: "config/base.yaml"

# Loop-ablation configuration. Keep the best motion-keyframe and IMU settings,
# but allow only the mandatory consecutive factor so appearance retrieval
# cannot deform the trajectory during repeated-view turns.
use_calib: False
single_thread: True
dataset:
  subsample: 1

tracking:
  imu_rotation_prior: True
  imu_rotation_constraint_weight: 0.6
  imu_rotation_constraint_gate_deg: 0.5
  motion_keyframe_translation: 0.30
  motion_keyframe_rotation_deg: 8.0

retrieval:
  enabled: False
  confirmation_frames: 2
  confirmation_immediate_frame_gap: 150
  confirmation_frame_id_radius: 60
  density_window: 10
  dense_min_keyframes: 10
  dense_max_mean_frame_gap: 24
